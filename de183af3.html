<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Cosmo — Stream the tape</title>
<meta name="description" content="Stream the Radio Cosmo cassette.">
<meta name="theme-color" content="#EED1BD">

<meta property="og:title" content="Radiocosmo — Stream the tape">
<meta property="og:description" content="Press play.">
<meta property="og:url" content="https://radiocosmo.net/tape">
<meta property="og:type" content="music.album">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23EED1BD'/><circle cx='16' cy='16' r='7' fill='%23E42C00'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Font Awesome 6 Free -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  :root{
    --bg:#EED1BD;
    --ink:#1D1818;
    --accent:#E42C00;
    --rule:rgba(29,24,24,.18);
    --soft:rgba(29,24,24,.6);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  [hidden]{display:none!important}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }

  .page{width:100%;max-width:440px;text-align:center}

  /* ---------- logo ---------- */
  .logo-img{display:block;margin:0 auto;width:min(220px,60%);height:auto}
  .logo-text{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800;font-size:clamp(38px,12vw,60px);
    line-height:.86;letter-spacing:-.045em;text-transform:uppercase;
  }
  .logo-text .cosmo{color:var(--accent)}

  /* ---------- title ---------- */
  .release{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800;font-size:26px;letter-spacing:-.02em;
    margin-top:28px;
  }
  /* ---------- transport ---------- */
  .transport{
    display:flex;align-items:center;justify-content:center;gap:22px;
    margin:38px 0 30px;
  }

  .skip{
    background:none;border:0;cursor:pointer;color:var(--ink);
    font-size:19px;padding:12px;line-height:1;
    opacity:.65;transition:opacity .15s ease;
  }
  .skip:hover{opacity:1}
  .skip span{display:block;font-size:9px;letter-spacing:.1em;margin-top:5px}

  .play{
    width:96px;height:96px;border-radius:50%;
    background:var(--accent);color:var(--bg);
    border:2px solid var(--ink);
    cursor:pointer;font-size:30px;line-height:1;
    display:grid;place-items:center;
    transition:background .18s ease,color .18s ease,transform .1s ease;
  }
  .play:hover{background:var(--ink);color:var(--bg)}
  .play:active{transform:scale(.96)}
  .play .fa-play{margin-left:5px} /* optical centring */

  button:focus-visible,input:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;
  }

  /* ---------- seek bar ---------- */
  .seek{
    -webkit-appearance:none;appearance:none;
    width:100%;height:22px;background:none;cursor:pointer;display:block;
  }
  .seek::-webkit-slider-runnable-track{
    height:6px;border-radius:0;
    background:linear-gradient(var(--accent),var(--accent)) 0/var(--pct,0%) 100% no-repeat,var(--rule);
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--ink);margin-top:-4px;
  }
  .seek::-moz-range-track{height:6px;background:var(--rule)}
  .seek::-moz-range-progress{height:6px;background:var(--accent)}
  .seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}
  .seek:disabled{opacity:.5;cursor:default}

  .times{
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--soft);margin-top:6px;
  }

  .status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:18px;min-height:14px}

  footer{margin-top:44px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  footer a{color:var(--soft);text-decoration:none}
  footer a:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!--
  ─── EDIT THESE ─────────────────────────────────────
  1. Put your audio file in the repo and set the <source src="..."> below.
  2. Set the release name in  and the side label in .side.
  3. logo.png sits in the repo root (../logo.png if this page is in /tape/).
  ────────────────────────────────────────────────────
-->

<main class="page">

  <h1>
    <img class="logo-img" src="logo-website1.svg" alt="Radiocosmo"
         onerror="this.remove();document.querySelector('.logo-text').hidden=false">
    <span class="logo-text" hidden>Radio<br><span class="cosmo">Cosmo</span></span>
  </h1>

  <p class="release">What Technology Wants</p>

  <audio id="tape" preload="metadata" playsinline>
    <source src="whattechnologywants-cassette.mp3" type="audio/mpeg">
  </audio>

  <div class="transport">
    <button class="skip" id="back" aria-label="Back 15 seconds">
      <i class="fa-solid fa-rotate-left"></i><span>15</span>
    </button>

    <button class="play" id="playBtn" aria-label="Play">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>

    <button class="skip" id="fwd" aria-label="Forward 15 seconds">
      <i class="fa-solid fa-rotate-right"></i><span>15</span>
    </button>
  </div>

  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1"
         aria-label="Seek" disabled>

  <div class="times">
    <span id="cur">0:00</span>
    <span id="dur">--:--</span>
  </div>

  <p class="status" id="status"></p>

  <footer><a href="/">radiocosmo.net</a></footer>

</main>

<script>
(function(){
  var a = document.getElementById('tape'),
      btn = document.getElementById('playBtn'),
      icon = document.getElementById('playIcon'),
      seek = document.getElementById('seek'),
      cur = document.getElementById('cur'),
      dur = document.getElementById('dur'),
      status = document.getElementById('status'),
      scrubbing = false;

  function fmt(s){
    if(!isFinite(s)) return '--:--';
    s = Math.floor(s);
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
  }

  function paint(){
    var pct = a.duration ? (a.currentTime / a.duration) * 100 : 0;
    seek.style.setProperty('--pct', pct + '%');
    if(!scrubbing) seek.value = Math.round(pct * 10);
    cur.textContent = fmt(a.currentTime);
  }

  a.addEventListener('loadedmetadata', function(){
    dur.textContent = fmt(a.duration);
    seek.disabled = false;
  });

  a.addEventListener('timeupdate', paint);
  a.addEventListener('error', function(){
    status.textContent = 'Audio unavailable';
    seek.disabled = true;
  });

  a.addEventListener('play', function(){
    icon.className = 'fa-solid fa-pause';
    btn.setAttribute('aria-label','Pause');
  });
  a.addEventListener('pause', function(){
    icon.className = 'fa-solid fa-play';
    btn.setAttribute('aria-label','Play');
  });
  a.addEventListener('ended', function(){ a.currentTime = 0; paint(); });

  btn.addEventListener('click', function(){
    if(a.paused){ a.play().catch(function(){ status.textContent = 'Tap play again'; }); }
    else { a.pause(); }
  });

  document.getElementById('back').addEventListener('click', function(){
    a.currentTime = Math.max(0, a.currentTime - 15);
  });
  document.getElementById('fwd').addEventListener('click', function(){
    a.currentTime = Math.min(a.duration || 0, a.currentTime + 15);
  });

  seek.addEventListener('pointerdown', function(){ scrubbing = true; });
  seek.addEventListener('input', function(){
    seek.style.setProperty('--pct', (seek.value/10) + '%');
    if(a.duration) cur.textContent = fmt(a.duration * seek.value/1000);
  });
  seek.addEventListener('change', function(){
    if(a.duration) a.currentTime = a.duration * seek.value/1000;
    scrubbing = false;
  });

  // space bar toggles playback
  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' && e.target === document.body){
      e.preventDefault();
      btn.click();
    }
  });

  // lock-screen / notification controls
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: document.querySelector('').textContent,
      artist: 'Radiocosmo',
      artwork: [{ src: 'logo.png', sizes: '512x512', type: 'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
    navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
  }
})();
</script>

</body>
</html>
