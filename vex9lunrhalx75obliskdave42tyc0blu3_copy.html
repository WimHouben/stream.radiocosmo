<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Beyond the Stars</title>
    <link rel="stylesheet" href="https://www.radiocosmo.net/style.css">


</head>
<body>

<img src="https://wimhouben.com/pub/albumcover.png" alt="Album Art">
<h2>
Journey Beyond the Stars
</h2>

<button class="player-button" id="play-pause"><div class="indicator" id="indicator"></div>Play
</button>

<audio id="player" style="display: none;"></audio>

<script>
        // Your song playlist - add your MP3 files here
        const songs = [
            "https://www.wimhouben.com/pub/radiocosmo/journeybeyondthestars/full-tape.mp3"
        ];
        
        const player = document.getElementById('player');
        const playPauseButton = document.getElementById('play-pause');
        const indicator = document.getElementById('indicator');
        let currentSong = 0;
        let isPlaying = false;
        
        // Toggle play/pause
        playPauseButton.onclick = function() {
            if (isPlaying) {
                player.pause();
                playPauseButton.childNodes[1].nodeValue = "Play";
                isPlaying = false;
            } else {
                if (player.src) {
                    player.play();
                } else {
                    playSong();
                }
                playPauseButton.childNodes[1].nodeValue = "Pause";
                indicator.style.animationPlayState = "running";
                isPlaying = true;
            }
        };
        
        // Play the current song
        function playSong() {
            player.src = songs[currentSong];
            player.play();
        }
        
        // When a song ends, play the next one
        player.onended = function() {
            currentSong = (currentSong + 1) % songs.length;
            playSong();
        };
    </script>
<br>
<p>
Thank you for your support. More on <a href="https://www.radiocosmo.net">www.radiocosmo.net</a>
</p>

</body>
</html>
